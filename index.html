<!DOCTYPE html>

<head>

<meta name="description" content="Demo educacional LAB 365 / SENAI — chat com o Zeca, assistente de IA da pizzaria fictícia PizzaCode, via widget oficial @n8n/chat.">

<body>
<div class="bar-top" aria-hidden="true"></div>

<header class="topbar">
  <h1 class="page-title">🍕 Zeca · PizzaCode</h1>
  <span class="badge">&lt;<b>LAB</b><span class="n">365</span>&gt; · IA para DEVs</span>
</header>

<main class="wrap">
  <div class="chat-card">
    <div id="n8n-chat"></div>
  </div>
  <p class="footer">Demo educacional · LAB 365 / SENAI</p>
</main>

<script type="module">
  import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

  // Troque aqui pela Production URL do webhook de chat do seu workflow n8n
  // (nó "When chat message received" / Webhook de chat → aba Production URL).
  const WEBHOOK_URL = 'https://felipe-ramos-oliveira-42.app.n8n.cloud/webhook/ce0d39c4-4b28-4f5b-97b7-9f8963d6afd0/chat';

  createChat({
    webhookUrl: WEBHOOK_URL,
    target: '#n8n-chat',
    mode: 'fullscreen',
    showWelcomeScreen: false,
    initialMessages: [
      'Olá! Sou o Zeca, atendente da PizzaCode 🍕',
      'Posso te ajudar com o cardápio e montar seu pedido. O que vai ser?',
    ],
    i18n: {
      en: {
        title: 'Zeca — PizzaCode',
        subtitle: 'Assistente de atendimento com IA',
        getStarted: 'Nova conversa',
        inputPlaceholder: 'Digite sua mensagem...',
      },
    },
  });
</script>
</body>
